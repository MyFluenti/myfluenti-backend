name: Database tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  sql-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Apply Supabase stub (plain Postgres only)
        run: psql -v ON_ERROR_STOP=1 -f tests/00_supabase_stub.sql

      - name: Apply migrations in order
        run: |
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "Applying $f"
            psql -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run smoke tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/10_smoke_test.sql | tee test-output.txt
          grep -q "TODOS OS TESTES PASSARAM" test-output.txt

      - name: Run library, review and profile tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/20_library_review_profile_test.sql | tee test-output-20.txt
          grep -q "TESTES BIBLIOTECA/REVISAO/PERFIL PASSARAM" test-output-20.txt

      - name: Run content delivery tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/30_content_delivery_test.sql | tee test-output-30.txt
          grep -q "TESTES ENTREGA DE CONTEUDO PASSARAM" test-output-30.txt

      - name: Run account deletion tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/40_account_deletion_test.sql | tee test-output-40.txt
          grep -q "TESTES EXCLUSAO DE CONTA PASSARAM" test-output-40.txt

      - name: Run profile avatar tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/50_profile_avatar_test.sql | tee test-output-50.txt
          grep -q "TESTES AVATAR PASSARAM" test-output-50.txt

      - name: Run content reference data tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/60_content_reference_test.sql | tee test-output-60.txt
          grep -q "TESTES REFERENCIA DE CONTEUDO PASSARAM" test-output-60.txt

      - name: Run onboarding tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/70_onboarding_test.sql | tee test-output-70.txt
          grep -q "TESTES ONBOARDING PASSARAM" test-output-70.txt

      - name: Run notes and idempotent level tests
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/80_notes_and_level_test.sql | tee test-output-80.txt
          grep -q "TESTES NOTAS E NIVEL PASSARAM" test-output-80.txt
